<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Voting box -->
    <rect x="100" y="100" width="200" height="200" rx="20" fill="#4f46e5" opacity="0.1"/>
    <rect x="100" y="100" width="200" height="200" rx="20" stroke="#6366f1" stroke-width="8"/>
    
    <!-- Ballot slot -->
    <rect x="150" y="80" width="100" height="10" rx="5" fill="#6366f1"/>
    
    <!-- Ballot paper -->
    <g transform="rotate(-15 250 150)">
        <rect x="220" y="50" width="80" height="100" rx="5" fill="white"/>
        <line x1="235" y1="70" x2="285" y2="70" stroke="#94a3b8" stroke-width="4"/>
        <line x1="235" y1="90" x2="285" y2="90" stroke="#94a3b8" stroke-width="4"/>
        <line x1="235" y1="110" x2="285" y2="110" stroke="#94a3b8" stroke-width="4"/>
    </g>
    
    <!-- Checkmark -->
    <path d="M150 200 L180 230 L250 160" stroke="#6366f1" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg> 