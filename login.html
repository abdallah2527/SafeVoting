<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Safe Voting</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Safe Voting</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Create Poll</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Schedule Meeting</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="demo.html">Demo</a>
                    </li>
                  
                    <li class="nav-item">
                        <a class="btn btn-outline-primary" href="login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="btn btn-primary ms-2" href="signup.html">Sign up</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Login Form -->
    <div class="auth-page">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-6 col-lg-5">
                    <div class="auth-form-container">
                        <h1 class="text-center mb-4">Log in to your account</h1>
                        <p class="text-center text-muted mb-4">Or <a href="signup.html">create a free account</a></p>

                        <form>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input type="checkbox" class="form-check-input" id="remember">
                                    <label class="form-check-label" for="remember">Remember me</label>
                                </div>
                                <a href="#" class="forgot-password">Forgot your password?</a>
                            </div>
                            <button type="submit" class="btn btn-primary w-100 mb-4">Log in</button>

                            <div class="text-center mb-3">
                                <p class="text-muted">Or continue with</p>
                            </div>

                            <div class="row g-3">
                                <div class="col-6">
                                    <a href="#" class="btn social-btn w-100">
                                        <i class="fab fa-google me-2"></i>
                                        Google
                                    </a>
                                </div>
                                <div class="col-6">
                                    <a href="#" class="btn social-btn w-100">
                                        <i class="fab fa-microsoft me-2"></i>
                                        Microsoft
                                    </a>
                                </div>
                                <div class="col-6">
                                    <a href="#" class="btn social-btn w-100">
                                        <i class="fab fa-discord me-2"></i>
                                        Discord
                                    </a>
                                </div>
                                <div class="col-6">
                                    <a href="#" class="btn social-btn w-100">
                                        <i class="fab fa-facebook me-2"></i>
                                        Facebook
                                    </a>
                                </div>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p class="text-muted mb-0">Don't have an account yet? <a href="signup.html">Sign up</a></p>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <nav class="auth-footer-nav">
                            <a href="index.html" class="me-3">Home</a>
                            <a href="#" class="me-3">Contact</a>
                            <a href="#" class="me-3">Terms</a>
                            <a href="#">Imprint</a>
                        </nav>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
